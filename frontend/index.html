<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Kalkulator - Pełne Równanie</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        canvas { border: 2px solid #333; background-color: white; cursor: crosshair; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .controls { margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; margin: 0 10px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; }
        button:hover { background-color: #0056b3; }
        button.danger { background-color: #dc3545; }
        button.danger:hover { background-color: #a71d2a; }
        #info { margin-top: 30px; font-size: 24px; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>

    <h2>Narysuj całe równanie (np. 2 + 2)</h2>
    <p>Zachowaj widoczne odstępy między znakami!</p>
    
    <canvas id="drawingCanvas" width="800" height="280"></canvas>

    <div class="controls">
        <button class="danger" onclick="clearCanvas()">Wyczyść</button>
        <button onclick="recognizeEquation()">Rozpoznaj równanie</button>
    </div>

    <div id="info">Czekam na Twoje równanie...</div>

    <script>
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 15;
        ctx.lineCap = "round";
        ctx.strokeStyle = "black";

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) {
                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.stroke();
            }
        });
        
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);

        function clearCanvas() {
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            document.getElementById('info').innerText = "Czekam na Twoje równanie...";
        }

        function recognizeEquation() {
            document.getElementById('info').innerText = "AI myśli...";

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            let inSegment = false;
            let startX = 0;
            let currentMinY = canvas.height;
            let currentMaxY = 0;
            const segments = [];

            for (let x = 0; x < canvas.width; x++) {
                let colHasBlack = false;
                let colMinY = canvas.height;
                let colMaxY = 0;

                for (let y = 0; y < canvas.height; y++) {
                    let idx = (y * canvas.width + x) * 4;
                    if (data[idx] < 128) { 
                        colHasBlack = true;
                        if (y < colMinY) colMinY = y;
                        if (y > colMaxY) colMaxY = y;
                    }
                }

                if (colHasBlack) {
                    if (!inSegment) {
                        inSegment = true;
                        startX = x;
                        currentMinY = colMinY;
                        currentMaxY = colMaxY;
                    } else {
                        if (colMinY < currentMinY) currentMinY = colMinY;
                        if (colMaxY > currentMaxY) currentMaxY = colMaxY;
                    }
                } else {
                    if (inSegment) {
                        inSegment = false;
                        if (x - startX > 5) {
                            segments.push({ x: startX, y: currentMinY, width: x - startX, height: currentMaxY - currentMinY });
                        }
                    }
                }
            }

            if (inSegment && canvas.width - startX > 5) {
                segments.push({ x: startX, y: currentMinY, width: canvas.width - startX, height: currentMaxY - currentMinY });
            }

            if (segments.length === 0) {
                document.getElementById('info').innerText = "Nic nie narysowano!";
                return;
            }

            const padding = 15;
            const promises = segments.map((seg, index) => {
                return new Promise((resolve) => {
                    let tempCanvas = document.createElement('canvas');
                    tempCanvas.width = seg.width + (padding * 2);
                    tempCanvas.height = seg.height + (padding * 2);
                    let tCtx = tempCanvas.getContext('2d');
                    
                    tCtx.fillStyle = "white";
                    tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                    
                    tCtx.drawImage(
                        canvas, 
                        seg.x - padding, seg.y - padding, seg.width + (padding * 2), seg.height + (padding * 2),
                        0, 0, tempCanvas.width, tempCanvas.height
                    );

                    tempCanvas.toBlob((blob) => {
                        resolve({ blob: blob, filename: `znak_${index}.png` });
                    }, "image/png");
                });
            });

            Promise.all(promises).then(files => {
                const formData = new FormData();
                
                files.forEach(fileObj => {
                    formData.append("files", fileObj.blob, fileObj.filename);
                });

                fetch("http://localhost:8080/calculator/evaluate_result", {
                    method: "POST",
                    body: formData
                })
                .then(response => {
                    if (!response.ok) throw new Error("Błąd serwera");
                    return response.json();
                })
                .then(data => {
                    document.getElementById('info').innerHTML = 
                        "Rozpoznane przez AI: <b>" + data.expression + "</b><br>" +
                        "Wysłane do obliczeń: <b>" + data.expression + "</b><br>" +
                        "Wynik Symji: <b style='color: green;'>" + data.result + "</b>";
                })
                .catch(error => {
                    console.error("Błąd:", error);
                    document.getElementById('info').innerText = "Wystąpił błąd podczas wnioskowania.";
                });
            });
        }
    </script>
</body>
</html>
